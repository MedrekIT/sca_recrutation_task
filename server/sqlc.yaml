version: "2"
sql:
  - schema: "db/schema"
    queries: "db/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/database"
        overrides:
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true

          - db_type: "pg_catalog.bpchar"
            nullable: true
            go_type:
              type: "string"
              pointer: true

          - db_type: "pg_catalog.time"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
