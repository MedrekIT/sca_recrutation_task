<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Sports events calendar</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="CSS/style.css"</link>
  </head>
  <body>
    <nav>
      <a href="createEvent.html">Create new event</a>
      <a href="index.html">Placeholder</a>
      <a href="index.html">Placeholder</a>
      <a href="index.html">Placeholder</a>
      <a href="index.html">Placeholder</a>
      <a href="index.html">Placeholder</a>
    </nav>
    <div id="events-container">
      <button id="filter-toggle">Filters</button>
      <div id="filters" style="display: none;">
        <label>Date:
          <input type="date" id="date-filter">
        </label>
        <label>Sport:
          <select id="sport-filter">
            <option value="">Choose sport</option>
          </select>
        </label>
        <button id="filter-button">Filter</button>
      </div>
      <table id="events-calendar"></table>
      <p id="errors" style="color: red;"></p>
    </div>
    <script>
    function loadCalendar(events) {
      const groupedByDate = {};
      events.forEach(ev => {
        if (!groupedByDate[ev.date]) groupedByDate[ev.date] = [];
        groupedByDate[ev.date].push(ev);
      });

      const table = document.getElementById("events-calendar");
      table.innerHTML = "";

      Object.keys(groupedByDate).forEach(day => {
        const dailyEvents = groupedByDate[day];

        let trDay = document.createElement("tr");
        trDay.classList.add("day");
        let thDay = document.createElement("th");
        thDay.colSpan = 5;
        thDay.textContent = `${day}`;
        trDay.appendChild(thDay);
        table.appendChild(trDay);

        const groupedByComp = {};
        dailyEvents.forEach(ev => {
          const key = `${ev.competition} ${ev.season} ${ev.stage}`;
          if (!groupedByComp[key]) groupedByComp[key] = [];
          groupedByComp[key].push(ev);
        });

        Object.keys(groupedByComp).forEach(key => {
          const compEvents = groupedByComp[key];

          let trComp = document.createElement("tr");
          trComp.classList.add("competition");
          let thComp = document.createElement("th");
          thComp.colSpan = 5;
          thComp.textContent = key;
          trComp.appendChild(thComp);
          table.appendChild(trComp);

          compEvents.forEach(ev => {
            let tr = document.createElement("tr");
            tr.style.cursor = "pointer";
            tr.addEventListener("click", () => {
              window.location.href = `event.html?id=${ev.event_id}`
            });

            const tdTime = document.createElement("td");
            tdTime.textContent = ev.time;
            tr.appendChild(tdTime);

            const tdHome = document.createElement("td");
            tdHome.textContent = ev.home;
            if (ev.result.winner === "home") tdHome.classList.add("winner");
            tr.appendChild(tdHome);

            const tdScore = document.createElement("td");
            tdScore.classList.add("score");
            if (ev.status === "scheduled" || ev.status === "postponed" || ev.status === "cancelled") tdScore.textContent = "-:-";
              else tdScore.textContent = `${ev.result.home_points} : ${ev.result.away_points}`;
            tr.appendChild(tdScore);

            const tdAway = document.createElement("td");
            tdAway.textContent = ev.away;
            if (ev.result.winner === "away") tdAway.classList.add("winner");
            tr.appendChild(tdAway);

            const tdStatus = document.createElement("td");
            tdStatus.textContent = ev.status.toUpperCase();
            tdStatus.classList.add(`status-${ev.status}`);
            tr.appendChild(tdStatus);

            table.appendChild(tr);
          });
        });
      });
    }

    function loadSportsFilter(sportsArr) {
      const sportsMenu = document.getElementById("sport-filter");

      sportsArr.forEach(sport => {
        let sportOption = document.createElement("option");
        sportOption.value = sport;
        sportOption.innerHTML = sport;
        sportsMenu.appendChild(sportOption);
      })
    }

    const filterMenu = document.getElementById("filters");
    document.getElementById("filter-toggle").addEventListener("click", (e) => {
      e.stopPropagation();
      filterMenu.style.display = filterMenu.style.display === "none" ? "flex" : "none";
    });
    document.addEventListener("click", (e) => {
      if (!filterMenu.contains(e.target)) {
        filterMenu.style.display = "none";
      }
    });

    document.getElementById("filter-button").addEventListener("click", () => {
      const date = document.getElementById("date-filter").value;
      const sport = document.getElementById("sport-filter").value;
      filterMenu.style.display = "none";
      loadEvents(date || null, sport || null);
    });

    async function loadEvents(dateFilter, sportFilter) {
      const url = new URL("http://localhost:8080/api/events");
      if (dateFilter) url.searchParams.append("date", dateFilter);
      if (sportFilter) url.searchParams.append("sport", sportFilter);

      try {
        document.getElementById("events-calendar").innerHTML = "";
        const res = await fetch(url.toString(), {
          method: "GET",
        });

        if (res.ok) {
          const apiData = await res.json();
          if (!apiData || apiData.length === 0) {
            document.getElementById("errors").textContent = "No events found";
            return;
          }
          const events = apiData.map(ev => ({
            event_id: ev.event_id,
            date: ev.date,
            time: ev.time || "TBA",
            status: ev.status,
            competition: ev.competition,
            season: ev.season,
            stage: ev.stage,
            home: ev.home || "TBA",
            away: ev.away || "TBA",
            result: ev.result
          }));

          document.getElementById("errors").textContent = "";
          loadCalendar(events);
        } else {
          const err = await res.json();
          document.getElementById("errors").textContent = err.message;
        }
      } catch (e) {
        document.getElementById("errors").textContent = e.message;
      }
    }

    (async () => {
      try {
        const res = await fetch("http://localhost:8080/api/sports", {
          method: "GET",
        });

        if (res.ok) {
          const sportsRes = await res.json();
          document.getElementById("errors").textContent = "";
          const availableSports = sportsRes || [];
          loadSportsFilter(availableSports);
        } else {
          const err = await res.json();
          document.getElementById("errors").textContent = err.message;
        }
      } catch (e) {
        document.getElementById("errors").textContent = e.message;
      }
    })();

    loadEvents();
    </script>
  </body>
</html>
